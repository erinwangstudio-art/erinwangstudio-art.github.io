<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="个人总结示意图：从业务场景到 AI 工作流再到业务结果">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4338ca"/>
    </marker>
    <style>
      .t{font-family:'PingFang SC','Noto Sans SC',system-ui,sans-serif}
      .kicker{font-size:17px;letter-spacing:3px;fill:#6b6b76}
      .headline{font-size:34px;font-weight:700;fill:#111114}
      .accent{fill:#4338ca}
      .node-title{font-size:22px;font-weight:700;fill:#111114}
      .node-body{font-size:17px;fill:#6b6b76}
      .metric{font-size:24px;font-weight:700;fill:#4338ca}
      .metric-label{font-size:15px;fill:#6b6b76}
      .caption{font-size:15px;fill:#9a9aa5}
    </style>
  </defs>

  <rect width="1200" height="750" fill="#fbfbfd"/>
  <rect x="1" y="1" width="1198" height="748" rx="18" fill="none" stroke="#e6e6ec"/>

  <text class="t kicker" x="70" y="70">PERSONAL SUMMARY · 根据个人总结生成</text>
  <text class="t headline" x="70" y="128">把非结构化的业务脏活，拆成<tspan class="accent">可编排的 AI 工作流</tspan>。</text>
  <text class="t node-body" x="70" y="166">9 年+ 产品经验 · 3 大业务领域 · 2 套可视化搭建平台 0→1 · 10+ AI 能力沉淀</text>

  <!-- node 1 -->
  <rect x="70" y="240" width="230" height="230" rx="16" fill="#fff" stroke="#d9d9e6"/>
  <rect x="70" y="240" width="230" height="6" rx="3" fill="#4338ca"/>
  <text class="t node-title" x="92" y="292">业务场景</text>
  <text class="t node-body" x="92" y="334">跨境电商</text>
  <text class="t node-body" x="92" y="368">建站 SaaS</text>
  <text class="t node-body" x="92" y="402">教育产品</text>
  <text class="t caption" x="92" y="444">复杂、分散、非结构化</text>

  <!-- arrow 1 -->
  <path d="M310 355 H350" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- node 2 -->
  <rect x="360" y="240" width="230" height="230" rx="16" fill="#fff" stroke="#d9d9e6"/>
  <rect x="360" y="240" width="230" height="6" rx="3" fill="#4338ca"/>
  <text class="t node-title" x="382" y="292">原子能力</text>
  <text class="t node-body" x="382" y="334">10+ AI 能力</text>
  <text class="t node-body" x="382" y="368">组件 / 模板库</text>
  <text class="t node-body" x="382" y="402">输入输出契约</text>
  <text class="t caption" x="382" y="444">把场景拆成可复用模块</text>

  <!-- arrow 2 -->
  <path d="M600 355 H640" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- node 3 -->
  <rect x="650" y="240" width="230" height="230" rx="16" fill="#fff" stroke="#d9d9e6"/>
  <rect x="650" y="240" width="230" height="6" rx="3" fill="#4338ca"/>
  <text class="t node-title" x="672" y="292">工作流编排</text>
  <text class="t node-body" x="672" y="334">人工审核 + AI 执行</text>
  <text class="t node-body" x="672" y="368">可视化 / 模板化</text>
  <text class="t node-body" x="672" y="402">失败降级路径</text>
  <text class="t caption" x="672" y="444">从能力到可跑的流程</text>

  <!-- arrow 3 -->
  <path d="M890 355 H930" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- node 4 -->
  <rect x="940" y="240" width="230" height="230" rx="16" fill="#fff" stroke="#d9d9e6"/>
  <rect x="940" y="240" width="230" height="6" rx="3" fill="#4338ca"/>
  <text class="t node-title" x="962" y="292">业务结果</text>
  <text class="t node-body" x="962" y="334">日均开款 500→4000</text>
  <text class="t node-body" x="962" y="368">人均店铺 10→40</text>
  <text class="t node-body" x="962" y="402">80%+ 流程覆盖</text>
  <text class="t caption" x="962" y="444">规模化、可复制、可运营</text>

  <rect x="70" y="540" width="1100" height="130" rx="16" fill="#eef0ff"/>
  <text class="t metric" x="110" y="600">9 年+</text>
  <text class="t metric-label" x="110" y="636">互联网产品经验</text>
  <text class="t metric" x="430" y="600">3 大</text>
  <text class="t metric-label" x="430" y="636">业务领域</text>
  <text class="t metric" x="730" y="600">2 套</text>
  <text class="t metric-label" x="730" y="636">可视化搭建平台 0→1</text>
  <text class="t metric" x="1030" y="600">10+</text>
  <text class="t metric-label" x="1030" y="636">AI 能力沉淀</text>

  <text class="t caption" x="70" y="712">王雅一 · AI 产品经理 · 业务抽象 → 能力沉淀 → 平台化 / AI 编排</text>
